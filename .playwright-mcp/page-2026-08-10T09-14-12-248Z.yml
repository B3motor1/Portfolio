            - paragraph [ref=f3e182]: When I was a Project Chair for IEEE@UH, I hosted a beginner workshop on building a cheap, web-controlled CCTV camera using an ESP32-CAM and a pair of servos for pan/tilt control. It's a fun intro to hardware and IoT that covers wiring, 3D printing custom mounts, and controlling a live stream over Wi-Fi. I put together a GitHub repo with the Arduino code, STL files, and step-by-step tutorial slides so anyone can follow along and build one.
