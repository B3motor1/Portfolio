          - paragraph [ref=f4e73]: Micromouse is an autonomous maze-solving robot that uses IR sensors to detect any walls ahead of it. The goal is to blindly finish a maze as quickly as possible with the best algorithm. Very old IEEE tradition. The way I designed this was to make my main body a PCB, which I designed in EasyEDA. It's a team project with my close friends here at UH.
